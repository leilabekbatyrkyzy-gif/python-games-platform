<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Қылыш пен Қалқан</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#f3f8ff;background:#13273a}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:850px;margin:auto}h1{font-size:clamp(26px,5vw,42px);margin:10px 0}p{color:#c6d8e5}.layout{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:20px;margin-top:20px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#344e65;padding:8px;border-radius:18px;aspect-ratio:1}.cell{background:#1d364d;border:0;border-radius:10px;cursor:pointer;display:grid;place-items:center}.cell:hover{background:#2b5067}.cell img{width:78%;height:78%;object-fit:contain}.panel{background:#156d70;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}.score{font-weight:700;font-size:21px}.status{min-height:55px;font-weight:700;color:#fff6bd}button.action{border:0;border-radius:10px;padding:13px 10px;background:#d7ef69;color:#162b33;font-weight:750;cursor:pointer}button.secondary{background:#e5eff8}a{color:#d7ef69}@media(max-width:650px){body{padding:14px}.layout{grid-template-columns:1fr}.panel{display:grid;grid-template-columns:1fr 1fr}.status{grid-column:span 2}.score{font-size:17px}}
</style><main><a href="javascript:history.back()">← Артқа</a><h1>⚔️ Қылыш пен Қалқан 🛡️</h1><p>Minimax жасанды интеллектіне қарсы немесе досыңызбен ойнаңыз. Үш белгіні қатар орналастырған жеңеді.</p><div class="layout"><div class="board" id="board" aria-label="Ойын алаңы"></div><div class="panel"><div class="score" id="sx">⚔️ Қылыш: 0</div><div class="score" id="so">🛡️ Қалқан: 0</div><div class="status" id="status" aria-live="polite"></div><button class="action" id="ai">ЖИ-мен ойна</button><button class="action" id="pvp">Досыңмен ойна</button><button class="action secondary" id="restart">Қайта бастау</button><button class="action secondary" id="sound">🔊 Дыбыс: қосулы</button></div></div></main><script>
const b=document.querySelector('#board'),status=document.querySelector('#status');let board,mode='ai',turn='X',done=false,scores={X:0,O:0},muted=false;
const sounds={click:new Audio('click.wav'),win:new Audio('win.wav'),draw:new Audio('draw.wav')};
function sound(k){if(muted)return;const a=sounds[k];a.pause();a.currentTime=0;a.play().catch(()=>{});}
function result(a){const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];for(const [x,y,z] of lines)if(a[x]&&a[x]===a[y]&&a[y]===a[z])return a[x];return a.every(Boolean)?'draw':null;}
function minimax(a,who,depth=0){let r=result(a);if(r)return {score:r==='O'?10-depth:r==='X'?depth-10:0};let best={score:who==='O'?-Infinity:Infinity,index:-1};for(let i=0;i<9;i++)if(!a[i]){a[i]=who;let score=minimax(a,who==='O'?'X':'O',depth+1).score;a[i]='';if(who==='O'?score>best.score:score<best.score)best={score,index:i};}return best;}
function reset(){board=Array(9).fill('');turn='X';done=false;draw();}
function draw(){b.innerHTML='';board.forEach((v,i)=>{const c=document.createElement('button');c.className='cell';c.setAttribute('aria-label',`Ұяшық ${i+1}`);if(v){const img=document.createElement('img');img.src=v==='X'?'sword.png':'shield.png';img.alt=v==='X'?'Қылыш':'Қалқан';c.append(img)}c.onclick=()=>move(i);b.append(c)});const r=result(board);status.textContent=r==='draw'?'Тең түсті!':r?`${r==='X'?'Қылыш':'Қалқан'} жеңді!`:turn==='X'?'Қылыштың кезегі':'Қалқанның кезегі';document.querySelector('#sx').textContent=`⚔️ Қылыш: ${scores.X}`;document.querySelector('#so').textContent=`🛡️ Қалқан: ${scores.O}`;}
function play(i){board[i]=turn;sound('click');let r=result(board);if(r){done=true;if(r==='draw')sound('draw');else{scores[r]++;sound('win')}}else turn=turn==='X'?'O':'X';draw();}
function move(i){if(done||board[i]||(mode==='ai'&&turn==='O'))return;play(i);if(!done&&mode==='ai'&&turn==='O'){setTimeout(()=>{if(!done&&mode==='ai'&&turn==='O'){let j=minimax(board.slice(),'O').index;if(j>=0)play(j)}},240)}}
document.querySelector('#ai').onclick=()=>{mode='ai';reset()};document.querySelector('#pvp').onclick=()=>{mode='pvp';reset()};document.querySelector('#restart').onclick=reset;document.querySelector('#sound').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇 Дыбыс: өшірулі':'🔊 Дыбыс: қосулы'};reset();
</script></html>
