<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тас, қағаз, қайшы · Python Games</title><link rel="stylesheet" href="../../css/style.css"><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head><body>
<main class="rps-wrap"><header><a id="back" href="../../index.html#catalog"></a><select id="language" aria-label="Тіл / Язык / Language"><option value="kk">ҚАЗ</option><option value="ru">РУС</option><option value="en">ENG</option></select></header>
<div class="rps-heading"><div><span class="eyebrow">PYTHON GAMES / PLAY THE PATTERN</span><h1 id="title"></h1><p id="intro"></p></div><span class="ai-badge"><i></i> ADAPTIVE AI</span></div>
<section class="arena" aria-labelledby="result"><div class="arena-top"><span id="round"></span><span id="memory"></span></div>
<div class="duel"><div class="contender"><div class="hand player-hand" id="player-hand"></div><span id="you"></span><strong id="player-choice"></strong></div><div class="versus"><span>VS</span><b id="countdown" aria-hidden="true">✦</b></div><div class="contender"><div class="hand ai-hand" id="ai-hand"></div><span id="opponent"></span><strong id="ai-choice"></strong></div></div>
<h2 id="result" role="status" aria-live="polite"></h2><div class="scoreboard"><div><span id="wins-label"></span><b id="wins">0</b></div><div><span id="draws-label"></span><b id="draws">0</b></div><div><span id="losses-label"></span><b id="losses">0</b></div></div></section>
<section class="move-section"><div class="move-heading"><h2 id="pick"></h2><span id="keys"></span></div><div class="move-buttons"><button data-choice="rock"><span class="choice-icon"></span><strong></strong><small>1</small></button><button data-choice="paper"><span class="choice-icon"></span><strong></strong><small>2</small></button><button data-choice="scissors"><span class="choice-icon"></span><strong></strong><small>3</small></button></div></section>
<section class="bottom-panel"><div><h2 id="history-title"></h2><ol id="history"></ol><p id="no-history"></p></div><div class="rules"><h2 id="rules-title"></h2><p id="rules"></p><button id="reset" class="button"></button><p id="note"></p></div></section></main></body></html>
