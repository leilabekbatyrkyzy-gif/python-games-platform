<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ақылды лабиринт · Python Games</title><link rel="stylesheet" href="../../css/style.css"><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body><main class="maze-wrap">
<header><a id="back" href="../../index.html#catalog"></a><select id="language" aria-label="Тіл / Язык / Language"><option value="kk">ҚАЗ</option><option value="ru">РУС</option><option value="en">ENG</option></select></header>
<span class="eyebrow">PYTHON GAMES / PUZZLE</span><h1 id="title"></h1><p id="intro"></p>
<div class="maze-layout"><canvas id="maze" width="620" height="620" tabindex="0" role="img"></canvas>

<div class="legend"><span id="player-label"></span><span id="goal-label"></span></div>
<div class="dpad" role="group"><button data-move="up">↑</button><div><button data-move="left">←</button><button data-move="down">↓</button><button data-move="right">→</button></div></div>
<button class="button" id="solve"></button><button class="button secondary" id="reset"></button><button class="button secondary" id="sound"></button><p id="help"></p></aside></div><p id="note"></p>
</main></body></html>
