const D={kk:{title:'♟ Ақылды Шахмат AI',sub:'Minimax · ЖИ-мен немесе досыңмен ойна',ai:'🤖 ЖИ-мен ойна',friend:'👥 Досыңмен ойна',hint:'💡 Көмек (Hint)',reset:'↻ Қайта бастау',sound:'🔊 Дыбыс',off:'🔇 Дыбыс өшірулі',white:'Ақтар кезегі',black:'Қаралар кезегі',thinking:'ЖИ ойланып жатыр…',mate:'Мат! Жеңімпаз:',draw:'Тең ойын!',check:'Шах!',score:'Фигуралар есебі',note:'Фигураны, содан кейін жүретін торды басыңыз. Пешка соңғы қатарға жетсе, автоматты түрде ферзьге айналады.',foot:'Ережелерді тексеру үшін chess.js кітапханасы қолданылады. Алғашқы ашылуда интернет қажет.',error:'Шахмат кітапханасы жүктелмеді. Интернетті қосып, бетті жаңартыңыз.'},ru:{title:'♟ Умные шахматы AI',sub:'Minimax · Против ИИ или с другом',ai:'🤖 Против ИИ',friend:'👥 С другом',hint:'💡 Подсказка',reset:'↻ Новая партия',sound:'🔊 Звук',off:'🔇 Звук выключен',white:'Ход белых',black:'Ход чёрных',thinking:'ИИ думает…',mate:'Мат! Победили:',draw:'Ничья!',check:'Шах!',score:'Баланс фигур',note:'Выберите фигуру, затем клетку. Пешка автоматически превращается в ферзя.',foot:'Правила проверяет chess.js. При первом запуске требуется интернет.',error:'Библиотека шахмат не загрузилась. Подключите интернет и обновите страницу.'},en:{title:'♟ Smart Chess AI',sub:'Minimax · Play AI or a friend',ai:'🤖 Play AI',friend:'👥 Play a friend',hint:'💡 Hint',reset:'↻ New game',sound:'🔊 Sound on',off:'🔇 Sound off',white:'White to move',black:'Black to move',thinking:'AI is thinking…',mate:'Checkmate! Winner:',draw:'Draw!',check:'Check!',score:'Material balance',note:'Select a piece and then its destination. Pawns promote to queen automatically.',foot:'Rules use chess.js. Internet is required on first load.',error:'Chess library failed to load. Connect to the internet and refresh.'}};
const icons={wk:'♔',wq:'♕',wr:'♖',wb:'♗',wn:'♘',wp:'♙',bk:'♚',bq:'♛',br:'♜',bb:'♝',bn:'♞',bp:'♟'};let game=typeof Chess!=='undefined'?new Chess():null,mode='ai',selected=null,hint=null,last=null,muted=false,busy=false,lang='kk';const $=id=>document.getElementById(id);let audio=null;function tone(freq=440,duration=.08,type='sine'){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}function melody(){[523,659,784,1047].forEach((n,i)=>setTimeout(()=>tone(n,.18),i*135))}function play(m){let before=game.in_check();let x=game.move(m);if(x){last=[x.from,x.to];selected=null;hint=null;tone(x.captured?220:490,x.captured?.14:.06,x.captured?'triangle':'sine');if(game.game_over())melody();else if(game.in_check())tone(880,.22);render()}return x}
const files='abcdefgh';function coords(s){return [files.indexOf(s[0]),8-Number(s[1])]}function legal(s){return game.moves({square:s,verbose:true}).map(x=>x.to)}function choose(s){if(!game||busy||game.game_over()||(mode==='ai'&&game.turn()==='b'))return;let p=game.get(s);if(selected&&legal(selected).includes(s)){play({from:selected,to:s,promotion:'q'});if(mode==='ai'&&!game.game_over()){busy=true;render();setTimeout(()=>{let m=best(2);if(m)play(m);busy=false;render()},70)}return}selected=p&&p.color===game.turn()?s:null;hint=null;render()}
const val={p:10,n:30,b:30,r:50,q:90,k:900};function evaluate(){if(game.in_checkmate())return game.turn()==='w'?-9999:9999;if(game.in_draw())return 0;let sum=0;game.board().forEach(row=>row.forEach(p=>{if(p)sum+=(p.color==='w'?1:-1)*val[p.type]}));return sum}function minimax(depth,alpha,beta){if(!depth||game.game_over())return evaluate();let white=game.turn()==='w',best=white?-Infinity:Infinity;for(let m of game.moves({verbose:true})){game.move(m);let sc=minimax(depth-1,alpha,beta);game.undo();if(white){best=Math.max(best,sc);alpha=Math.max(alpha,best)}else{best=Math.min(best,sc);beta=Math.min(beta,best)}if(beta<=alpha)break}return best}function best(depth){let white=game.turn()==='w',score=white?-Infinity:Infinity,result=null;for(let m of game.moves({verbose:true})){game.move(m);let sc=minimax(depth-1,-10000,10000);game.undo();if((white&&sc>score)||(!white&&sc<score)){score=sc;result=m}}return result}
function render(){let t=D[lang];$('title').textContent=t.title;$('subtitle').textContent=t.sub;$('ai').textContent=t.ai;$('friend').textContent=t.friend;$('hint').textContent=t.hint;$('reset').textContent=t.reset;$('sound').textContent=muted?t.off:t.sound;$('note').textContent=t.note;$('foot').textContent=t.foot;$('ai').classList.toggle('active',mode==='ai');$('friend').classList.toggle('active',mode==='friend');if(!game){$('turnLabel').textContent=({kk:'Қазір жүріс:',ru:'Сейчас ход:',en:'Current turn:'})[lang];$('status').textContent=t.error;$('scoreLabel').textContent='';$('score').textContent='';$('stateLabel').textContent='';$('state').textContent='';return}let winner=game.turn()==='w'?t.black:t.white;$('status').textContent=busy?t.thinking:game.in_checkmate()?`${t.mate} ${winner}`:game.in_draw()?t.draw:(game.turn()==='w'?t.white:t.black)+(game.in_check()?' · '+t.check:'');$('turnLabel').textContent=({kk:'Қазір жүріс:',ru:'Сейчас ход:',en:'Current turn:'})[lang];$('scoreLabel').textContent=({kk:'Есеп (бағалау):',ru:'Оценка позиции:',en:'Position evaluation:'})[lang];$('stateLabel').textContent=({kk:'Партия күйі:',ru:'Состояние партии:',en:'Game status:'})[lang];$('state').textContent=game.game_over()?(game.in_checkmate()?t.mate:t.draw):({kk:'Ойын жалғасуда',ru:'Игра продолжается',en:'Game in progress'})[lang];$('score').textContent=(evaluate()/10).toFixed(1);let b=$('board');b.innerHTML='';let moves=selected?legal(selected):[];for(let r=0;r<8;r++)for(let c=0;c<8;c++){let s=files[c]+(8-r),p=game.get(s),el=document.createElement('button');el.className='sq '+((r+c)%2?'dark':'light')+(s===selected?' selected':'')+(moves.includes(s)?' legal':'')+(hint&&(hint.from===s||hint.to===s)?' hint':'')+(last&&last.includes(s)?' last':'');el.setAttribute('aria-label',s);if(p){let span=document.createElement('span');span.textContent=icons[p.color+p.type];span.className=p.color==='w'?'white-piece':'black-piece';el.appendChild(span)}el.onclick=()=>choose(s);b.appendChild(el)}}$('ai').onclick=()=>{mode='ai';game.reset();selected=hint=last=null;busy=false;render()};$('friend').onclick=()=>{mode='friend';game.reset();selected=hint=last=null;busy=false;render()};$('reset').onclick=()=>{game.reset();selected=hint=last=null;busy=false;render()};$('hint').onclick=()=>{if(game&&!game.game_over()&&!busy){hint=best(2);render();tone(620,.12)}};$('sound').onclick=()=>{muted=!muted;render();if(!muted)tone(660)};$('lang').onchange=e=>{lang=e.target.value;document.documentElement.lang=lang;render()};render();
</script></body></html>
