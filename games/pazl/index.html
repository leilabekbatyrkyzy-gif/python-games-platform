<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Puzzle Master AI</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#edf1ff;background:#0c1025}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 10%,#322260 0%,transparent 45%),radial-gradient(ellipse at 90% 85%,#173a57 0%,transparent 40%),#0c1025}main{max-width:1100px;margin:auto;padding:24px 18px 55px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.back{color:#c1c9e9;text-decoration:none}h1{font-size:clamp(29px,5vw,50px);margin:26px 0 4px;letter-spacing:-1.8px}h1 span{color:#ad8dff}.sub{color:#aeb8d4;margin:0 0 24px}.panel{background:#171d38d9;border:1px solid #ffffff20;border-radius:24px;padding:20px;box-shadow:0 24px 70px #0005}.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:22px}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}button,select,.upload{font:inherit;border:1px solid #ffffff27;border-radius:13px;padding:11px 14px;background:#242c50;color:#fff;cursor:pointer}button:hover,.upload:hover{background:#35416e}button.active{background:#704ce2;border-color:#a58aff}.primary{background:linear-gradient(120deg,#8760fc,#537bfa);border:0;font-weight:750}.hint{background:#c8fa76;color:#18250b;font-weight:800;border:0}.board{width:min(100%,550px);aspect-ratio:1;margin:auto;display:grid;gap:5px;background:#0a102a;border-radius:20px;padding:7px;box-shadow:inset 0 0 0 1px #ffffff24}.tile{display:flex;align-items:center;justify-content:center;border-radius:11px;background:linear-gradient(145deg,#7052d7,#314b9d);font-size:clamp(20px,4vw,44px);font-weight:800;user-select:none;box-shadow:0 4px 0 #141739;border:1px solid #ffffff24;padding:0;min-width:0}.tile.blank{background:#151c35;box-shadow:none;border:1px dashed #ffffff19;cursor:default}.tile.help{outline:4px solid #d1ff76;outline-offset:-4px;animation:pulse 1s infinite alternate}@keyframes pulse{to{filter:brightness(1.5)}}.tile.pic{background-repeat:no-repeat;border:1px solid #ffffff38}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 20px}.stat{background:#10172f;border-radius:15px;padding:14px}.stat b{display:block;font-size:28px}.stat small{color:#a9b5d6}.label{font-weight:750;margin:18px 0 10px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.thumb{aspect-ratio:1;padding:3px;border-radius:13px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px}.thumb.chosen{outline:3px solid #c7f675}.upload{display:block;text-align:center;margin-top:12px}.upload input{display:none}.preview{display:block;max-width:200px;width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;margin:12px auto}.message{min-height:28px;color:#c9f88d;font-weight:700}.note{color:#aeb8d4;font-size:13px;line-height:1.5}.hidden{display:none!important}@media(max-width:750px){.layout{grid-template-columns:1fr}.panel{padding:14px}.board{max-width:520px}.tile{border-radius:7px}}
</style></head><body><main><div class="top"><a class="back" href="../../index.html#catalog">← Python Games</a><select id="lang" aria-label="Language"><option value="kk">ҚАЗ</option><option value="ru">РУС</option><option value="en">ENG</option></select></div><h1>PUZZLE <span>MASTER AI</span> 🧩</h1><p class="sub" id="subtitle"></p><div class="layout"><section class="panel"><div class="controls"><select id="size" aria-label="Board size"><option value="3">3 × 3</option><option value="4" selected>4 × 4</option><option value="5">5 × 5</option></select><button id="numbers" class="active"></button><button id="pictures"></button><button id="restart" class="primary"></button></div><div id="board" class="board" aria-label="Puzzle board"></div><p id="message" class="message" role="status"></p><div class="controls"><button id="hint" class="hint"></button><button id="previewButton"></button></div></section><aside class="panel"><div class="stats"><div class="stat"><small id="movesLabel"></small><b id="moves">0</b></div><div class="stat"><small id="timeLabel"></small><b id="time">00:00</b></div></div><div id="pictureControls"><p class="label" id="galleryLabel"></p><div id="gallery" class="gallery"></div><label class="upload"><span id="uploadLabel"></span><input id="upload" type="file" accept="image/png,image/jpeg,image/webp"></label><img id="preview" class="preview" alt="Puzzle reference image"></div><p id="note" class="note"></p></aside></div></main><script>
const $=s=>document.querySelector(s),dict={kk:{subtitle:'Сандарды немесе суретті жина. ЖИ көмегі келесі жүрісті көрсетеді.',numbers:'🔢 Сандар',pictures:'🖼️ Суреттер',restart:'↻ Жаңа ойын',hint:'✦ ЖИ көмегі',preview:'Үлгіні көрсету / жасыру',moves:'Жүрістер',time:'Уақыт',gallery:'Дайын суреттер',upload:'📁 Өз суретімді жүктеу',note:'Бос орынға көршілес ұяшықты басыңыз. ЖИ көмегі шешімге бағыттайтын жүрісті көрсетеді.',help:'Жасыл жиекті ұяшықты жылжытыңыз.',win:'Жарайсыз! Пазл шешілді!',wait:'Шешім ізделуде…',limit:'Бұл деңгейде ЖИ жылдам кеңес береді.',bad:'Сурет жүктелмеді.'},ru:{subtitle:'Собери числа или картинку. ИИ подскажет следующий ход.',numbers:'🔢 Числа',pictures:'🖼️ Картинки',restart:'↻ Новая игра',hint:'✦ Помощь ИИ',preview:'Показать / скрыть образец',moves:'Ходы',time:'Время',gallery:'Готовые картинки',upload:'📁 Загрузить фото',note:'Нажимай на плитку рядом с пустой клеткой. Подсказка направляет к решению.',help:'Передвинь выделенную плитку.',win:'Отлично! Пазл собран!',wait:'Ищем решение…',limit:'На этом уровне доступна быстрая подсказка.',bad:'Не удалось загрузить изображение.'},en:{subtitle:'Solve numbers or pictures. AI assistance highlights the next move.',numbers:'🔢 Numbers',pictures:'🖼️ Pictures',restart:'↻ New game',hint:'✦ AI hint',preview:'Show / hide reference',moves:'Moves',time:'Time',gallery:'Ready-made pictures',upload:'📁 Upload image',note:'Tap a tile adjacent to the empty square. Hints guide you toward the solution.',help:'Move the highlighted tile.',win:'Great job! Puzzle solved!',wait:'Finding a move…',limit:'A quick hint is available for this level.',bad:'Could not load image.'}};
const themes=[['🏔️','#122954','#e9a77d','#70d6ff'],['🪐','#180d3c','#e364c4','#b8a1ff'],['🌊','#073956','#2ac4d9','#e4df86'],['🌲','#153e32','#8cce6d','#f9c977'],['🏙️','#273557','#fa9b7b','#90bbff'],['🌻','#423047','#f7b94e','#c3e68e']];
const art=themes.map(([emoji,a,b,c])=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient></defs><rect width="600" height="600" fill="url(#g)"/><circle cx="450" cy="135" r="90" fill="'+c+'" opacity=".8"/><path d="M0 420 170 210 320 400 430 290 600 480V600H0Z" fill="'+c+'" opacity=".45"/><text x="300" y="355" text-anchor="middle" font-size="195">'+emoji+'</text></svg>'));
let lang='kk',n=4,mode='numbers',image=art[0],tiles=[],moves=0,start=0,won=false,hinted=-1,showPreview=true,timer;
try{const saved=localStorage.getItem('python-games-language');if(dict[saved])lang=saved}catch{}$('#lang').value=lang;
const tr=k=>dict[lang][k];function translate(){document.documentElement.lang=lang;for(const [id,key] of [['subtitle','subtitle'],['numbers','numbers'],['pictures','pictures'],['restart','restart'],['hint','hint'],['previewButton','preview'],['movesLabel','moves'],['timeLabel','time'],['galleryLabel','gallery'],['uploadLabel','upload'],['note','note']])$('#'+id).textContent=tr(key);$('#numbers').classList.toggle('active',mode==='numbers');$('#pictures').classList.toggle('active',mode==='pictures');$('#pictureControls').classList.toggle('hidden',mode!=='pictures');render()}
function neighbors(i){const a=[];let r=Math.floor(i/n),c=i%n;if(r>0)a.push(i-n);if(r<n-1)a.push(i+n);if(c>0)a.push(i-1);if(c<n-1)a.push(i+1);return a}
function solved(a){return a.every((x,i)=>x===(i+1)%(n*n))}
function newGame(){tiles=Array.from({length:n*n},(_,i)=>(i+1)%(n*n));let prev=-1;for(let i=0;i<n*n*16;i++){const blank=tiles.indexOf(0);const opts=neighbors(blank).filter(x=>x!==prev);const at=opts[Math.floor(Math.random()*opts.length)];[tiles[blank],tiles[at]]=[tiles[at],tiles[blank]];prev=blank}if(solved(tiles)){const k=neighbors(tiles.indexOf(0))[0];[tiles[k],tiles[tiles.indexOf(0)]]=[0,tiles[k]]}moves=0;won=false;hinted=-1;start=Date.now();$('#message').textContent='';render();clearInterval(timer);timer=setInterval(updateStats,500);updateStats()}
function updateStats(){$('#moves').textContent=moves;let t=Math.floor((Date.now()-start)/1000);if(won)return;$('#time').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function render(){const b=$('#board');b.style.gridTemplateColumns='repeat('+n+',1fr)';b.replaceChildren();tiles.forEach((v,i)=>{const el=document.createElement('button');el.className='tile'+(v===0?' blank':'')+(i===hinted?' help':'');el.disabled=v===0||won;el.setAttribute('aria-label',v===0?'Empty':String(v));if(v){if(mode==='numbers')el.textContent=v;else{const r=Math.floor((v-1)/n),c=(v-1)%n;el.classList.add('pic');el.style.backgroundImage='url("'+image+'")';el.style.backgroundSize=n*100+'% '+n*100+'%';el.style.backgroundPosition=(c/(n-1)*100)+'% '+(r/(n-1)*100)+'%'}}el.onclick=()=>move(i);b.append(el)});$('#preview').src=image;$('#preview').classList.toggle('hidden',mode!=='pictures'||!showPreview)}
function move(i){if(won)return;const z=tiles.indexOf(0);if(!neighbors(z).includes(i))return;[tiles[z],tiles[i]]=[tiles[i],tiles[z]];moves++;hinted=-1;render();updateStats();if(solved(tiles)){won=true;$('#message').textContent=tr('win');clearInterval(timer)}else $('#message').textContent=''}
function heuristic(a){let h=0;for(let i=0;i<a.length;i++){let v=a[i];if(!v)continue;let g=v-1;h+=Math.abs(Math.floor(i/n)-Math.floor(g/n))+Math.abs(i%n-g%n)}return h}
function key(a){return a.join(',')}
function hint(){if(won)return;$('#message').textContent=tr('wait');const initial=tiles.slice(),z=initial.indexOf(0);let best=null;
// Bounded A* for easy positions, weighted heuristic for larger boards.
const open=[{a:initial,z,g:0,h:heuristic(initial),first:-1}],seen=new Map([[key(initial),0]]);let found=null,limit=n===3?65000:n===4?8500:2500,weight=n===3?1:1.7;for(let count=0;open.length&&count<limit;count++){let bi=0,bf=Infinity;for(let i=0;i<open.length;i++){let q=open[i],f=q.g+weight*q.h;if(f<bf){bf=f;bi=i}}const cur=open.splice(bi,1)[0];if(cur.h===0){found=cur.first;break}for(const ix of neighbors(cur.z)){let a=cur.a.slice();[a[ix],a[cur.z]]=[a[cur.z],a[ix]];let g=cur.g+1,k=key(a);if((seen.get(k)??Infinity)<=g)continue;seen.set(k,g);open.push({a,z:ix,g,h:heuristic(a),first:cur.first===-1?ix:cur.first})}if(open.length>16000)break}
if(found!==null)hinted=found;else{let candidates=neighbors(z);candidates.sort((a,b)=>{const score=i=>{let q=initial.slice();[q[z],q[i]]=[q[i],q[z]];return heuristic(q)};return score(a)-score(b)});hinted=candidates[0]}$('#message').textContent=tr('help')+(found===null?' '+tr('limit'):'');render()}
$('#size').onchange=e=>{n=+e.target.value;newGame()};$('#numbers').onclick=()=>{mode='numbers';translate();newGame()};$('#pictures').onclick=()=>{mode='pictures';translate();newGame()};$('#restart').onclick=newGame;$('#hint').onclick=()=>setTimeout(hint,15);$('#previewButton').onclick=()=>{showPreview=!showPreview;render()};$('#lang').onchange=e=>{lang=e.target.value;try{localStorage.setItem('python-games-language',lang)}catch{}translate()};const gallery=$('#gallery');art.forEach((src,i)=>{const b=document.createElement('button');b.className='thumb'+(i===0?' chosen':'');const im=document.createElement('img');im.src=src;im.alt='Picture '+(i+1);b.append(im);b.onclick=()=>{image=src;gallery.querySelectorAll('button').forEach(x=>x.classList.remove('chosen'));b.classList.add('chosen');newGame()};gallery.append(b)});$('#upload').onchange=e=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')||file.size>12*1024*1024){$('#message').textContent=tr('bad');return}const reader=new FileReader();reader.onload=()=>{image=reader.result;gallery.querySelectorAll('button').forEach(x=>x.classList.remove('chosen'));mode='pictures';translate();newGame()};reader.onerror=()=>$('#message').textContent=tr('bad');reader.readAsDataURL(file)};translate();newGame();
</script></body></html>
