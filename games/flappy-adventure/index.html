<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flappy Adventure</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 30% 0%,#2b346a,#0b1027 65%);font-family:system-ui,Arial,sans-serif;color:#fff}main{max-width:1000px;margin:auto;padding:18px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}a{color:#d6e3ff;text-decoration:none}h1{font-size:clamp(30px,5vw,52px);margin:18px 0 2px;letter-spacing:-1.5px}h1 span{color:#b9fc7a}p{color:#b8c6e7;margin:0 0 17px}select,button{background:#283358;border:1px solid #ffffff35;color:#fff;border-radius:12px;padding:11px 15px;font:inherit;cursor:pointer}.panel{padding:12px;border-radius:22px;background:#1b2444;border:1px solid #ffffff20;box-shadow:0 22px 70px #0005}.stage{position:relative;overflow:hidden;border-radius:14px;background:#70c5ce}canvas{display:block;width:100%;height:auto;touch-action:manipulation;cursor:pointer}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#07132b8c;text-align:center;padding:20px}.overlay.hidden{display:none}.overlay article{background:#141e3eec;padding:24px 28px;border:1px solid #ffffff45;border-radius:22px;max-width:450px}.overlay h2{font-size:clamp(24px,4vw,40px);margin:0 0 8px}.overlay p{line-height:1.5}.primary{background:#b7f572;color:#15220b;font-weight:800;border:0;padding:14px 24px}.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 5px 3px}.stat{display:flex;gap:20px;font-weight:700}.stat span{color:#b8c6e7;font-weight:400}.note{font-size:13px;color:#bac7e3;margin-top:12px}@media(max-width:550px){main{padding:9px}.panel{padding:6px}.overlay article{padding:16px}.bottom{gap:6px}}
</style></head><body><main><div class="head"><a href="../../index.html#catalog">← Python Games</a><select id="lang"><option value="kk">ҚАЗ</option><option value="ru">РУС</option><option value="en">ENG</option></select></div><h1>FLAPPY <span>ADVENTURE</span> 🐤</h1><p id="intro"></p><div class="panel"><div class="stage"><canvas id="game" width="800" height="600" aria-label="Flappy Adventure game"></canvas><div class="overlay" id="overlay"><article><h2 id="headline"></h2><p id="message"></p><button class="primary" id="start"></button></article></div></div><div class="bottom"><div class="stat"><div><span id="scoreText"></span> <b id="score">0</b></div><div><span id="bestText"></span> <b id="best">0</b></div></div><div><button id="pause"></button> <button id="restart"></button></div></div></div><div class="note" id="note"></div></main><script>
const $=s=>document.querySelector(s),canvas=$('#game'),ctx=canvas.getContext('2d'),W=800,H=600,G=520;
const texts={kk:{intro:'Қанат қағып ұш, кедергілерден өт, рекорд орнат!',score:'Ұпай:',best:'Рекорд:',pause:'⏸ Үзіліс',resume:'▶ Жалғастыру',restart:'↻ Қайта бастау',start:'Ұшуды бастау',again:'Қайта ойнау',ready:'Ұшуға дайынсың ба?',over:'Ойын аяқталды!',paused:'Үзіліс',readyMsg:'Бос орын пернесін бас немесе экранды түрт. Үш өмірің бар!',overMsg:'Ұпайың: {score}. Рекордың: {best}.',pausedMsg:'Жалғастыру үшін батырманы бас.',note:'Басқару: Space / ↑ / тышқан / экранды түрту. Әр 30 ұпай сайын кедергілердің стилі өзгереді.'},ru:{intro:'Взмахни крыльями, обходи препятствия и ставь рекорды!',score:'Очки:',best:'Рекорд:',pause:'⏸ Пауза',resume:'▶ Продолжить',restart:'↻ Заново',start:'Начать полёт',again:'Играть снова',ready:'Готов к полёту?',over:'Игра окончена!',paused:'Пауза',readyMsg:'Нажми пробел или коснись экрана. У тебя три жизни!',overMsg:'Очки: {score}. Рекорд: {best}.',pausedMsg:'Нажми кнопку, чтобы продолжить.',note:'Управление: Space / ↑ / мышь / касание. Каждые 30 очков меняется стиль препятствий.'},en:{intro:'Flap, dodge obstacles and beat your high score!',score:'Score:',best:'Best:',pause:'⏸ Pause',resume:'▶ Resume',restart:'↻ Restart',start:'Start flying',again:'Play again',ready:'Ready to fly?',over:'Game over!',paused:'Paused',readyMsg:'Press Space or tap the screen. You have three lives!',overMsg:'Score: {score}. Best: {best}.',pausedMsg:'Press the button to continue.',note:'Controls: Space / ↑ / mouse / touch. Obstacles change style every 30 points.'}};
let lang='kk';try{let v=localStorage.getItem('python-games-language');if(texts[v])lang=v}catch{}$('#lang').value=lang;const t=k=>texts[lang][k];
let state='ready',score=0,best=0,lives=3,bird,pipes=[],cats=[],clouds=[],frame=0,spawn=0,inv=0,recordFlash=0,last=0,acc=0;
try{best=Number(localStorage.getItem('flappy-adventure-best'))||0}catch{}
function reset(){score=0;lives=3;bird={x:150,y:300,vy:0,angle:0};pipes=[];cats=[];clouds=Array.from({length:7},()=>({x:Math.random()*W,y:35+Math.random()*200,s:.45+Math.random()*.7,z:.7+Math.random()*.7}));frame=0;spawn=0;inv=0;recordFlash=0;state='ready';updateUI()}
function updateUI(){$('#score').textContent=score;$('#best').textContent=best;$('#pause').textContent=t(state==='paused'?'resume':'pause');$('#pause').disabled=state==='ready'||state==='over';$('#intro').textContent=t('intro');$('#scoreText').textContent=t('score');$('#bestText').textContent=t('best');$('#restart').textContent=t('restart');$('#note').textContent=t('note');let overlay=$('#overlay');overlay.classList.toggle('hidden',state==='playing');if(state!=='playing'){let key=state==='ready'?'ready':state==='over'?'over':'paused';$('#headline').textContent=t(key);$('#message').textContent=t(key+'Msg').replace('{score}',score).replace('{best}',best);$('#start').textContent=t(state==='over'?'again':state==='paused'?'resume':'start')}}
function flap(){if(state==='over'){reset();state='playing'}else if(state==='ready'){state='playing'}else if(state==='paused'){state='playing'}if(state==='playing')bird.vy=-5.5;updateUI()}
function hurt(){if(inv>0||state!=='playing')return;lives--;if(lives<=0){state='over';if(score>best){best=score;try{localStorage.setItem('flappy-adventure-best',String(best))}catch{}}updateUI();return}inv=120;pipes=[];cats=[];bird.vy=-5;bird.y=Math.min(bird.y,G-55);spawn=0}
function hit(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by}
function step(){frame++;for(const c of clouds){c.x-=c.s;if(c.x< -150)c.x=W+50}
if(state!=='playing')return;
bird.vy+=.25;bird.y+=bird.vy;bird.angle=Math.max(-.5,Math.min(.6,bird.vy*.075));if(inv>0)inv--;
const speed=3+Math.floor(score/30)*.8,rate=Math.max(45,100-Math.floor(score/15)*5);
spawn++;if(spawn>=rate){spawn=0;pipes.push({x:W+10,w:70,gap:190,top:100+Math.random()*170,passed:false,style:Math.floor(score/30)})}
if(score>=50&&frame%160===0)cats.push({x:W+50,y:G-115,vy:-11,w:45,h:35});
for(const p of pipes){p.x-=speed;if(inv===0&&(hit(bird.x-15,bird.y-10,30,20,p.x,0,p.w,p.top)||hit(bird.x-15,bird.y-10,30,20,p.x,p.top+p.gap,p.w,G-p.top-p.gap))){hurt();break}if(!p.passed&&p.x+p.w<bird.x){p.passed=true;score++;if(score>best){best=score;recordFlash=95;try{localStorage.setItem('flappy-adventure-best',String(best))}catch{}}updateUI()}}
pipes=pipes.filter(p=>p.x+p.w>-20);
for(const c of cats){c.x-=4.5;c.vy+=.4;c.y+=c.vy;if(c.y+c.h>=G){c.y=G-c.h;c.vy=-10-Math.random()*5}if(inv===0&&hit(bird.x-15,bird.y-10,30,20,c.x,c.y,c.w,c.h)){hurt();break}}
cats=cats.filter(c=>c.x+c.w>0);
if(bird.y+13>=G){bird.y=G-13;hurt()}if(bird.y<15){bird.y=15;bird.vy=Math.max(0,bird.vy)}if(recordFlash>0)recordFlash--}
function cloud(c){ctx.fillStyle='#ffffffc9';ctx.beginPath();ctx.ellipse(c.x,c.y+30,36*c.z,21*c.z,0,0,7);ctx.ellipse(c.x+32*c.z,c.y+20*c.z,43*c.z,30*c.z,0,0,7);ctx.ellipse(c.x+65*c.z,c.y+32*c.z,32*c.z,20*c.z,0,0,7);ctx.fill()}
function pipe(p){let s=p.style;let colors=['#70bf38','#37c958','#167bdf','#98613a','#d9dde7'];let color=colors[Math.min(s,4)];ctx.fillStyle=color;ctx.strokeStyle=s===2?'#fff':'#20354a';ctx.lineWidth=3;ctx.fillRect(p.x,0,p.w,p.top);ctx.strokeRect(p.x,0,p.w,p.top);ctx.fillRect(p.x,p.top+p.gap,p.w,G-(p.top+p.gap));ctx.strokeRect(p.x,p.top+p.gap,p.w,G-(p.top+p.gap));if(s===0){ctx.fillStyle='#a7e565';ctx.fillRect(p.x-5,p.top-25,p.w+10,25);ctx.fillRect(p.x-5,p.top+p.gap,p.w+10,25)}else if(s===1){ctx.fillStyle='#115c30';ctx.fillRect(p.x+p.w-15,0,10,p.top);ctx.fillRect(p.x+p.w-15,p.top+p.gap,10,G)}else if(s===2){ctx.strokeStyle='#e2f8ff';ctx.beginPath();ctx.moveTo(p.x,0);ctx.lineTo(p.x+p.w,p.top);ctx.moveTo(p.x+p.w,0);ctx.lineTo(p.x,p.top);ctx.stroke()}else if(s===3){ctx.fillStyle='#40a34b';ctx.fillRect(p.x,p.top-15,p.w,15);ctx.fillRect(p.x,p.top+p.gap,p.w,15)}else{ctx.fillStyle='#ffae40';ctx.fillRect(p.x,p.top-10,p.w,10);ctx.fillStyle='#42bfff';ctx.fillRect(p.x,p.top+p.gap,p.w,10)}}
function drawBird(){if(inv>0&&Math.floor(frame/5)%2===0)return;ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.angle);const flap=Math.sin(frame*.42),bob=Math.sin(frame*.14)*1.5;ctx.translate(0,bob);ctx.shadowColor='#72551a55';ctx.shadowBlur=11;ctx.shadowOffsetY=4;
// Little rounded tail feathers
ctx.fillStyle='#e6a52a';ctx.strokeStyle='#bd7b18';ctx.lineWidth=1.4;for(const [x,y,angle] of [[-23,-9,-.45],[-26,0,0],[-23,10,.45]]){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.beginPath();ctx.ellipse(-6,0,13,6,0,0,7);ctx.fill();ctx.stroke();ctx.restore()}
// Soft round fluffy body
let gold=ctx.createRadialGradient(-9,-12,3,2,4,31);gold.addColorStop(0,'#fff9b9');gold.addColorStop(.38,'#ffe86a');gold.addColorStop(.78,'#ffc83a');gold.addColorStop(1,'#f5a925');ctx.fillStyle=gold;ctx.strokeStyle='#c18a27';ctx.lineWidth=1.8;ctx.beginPath();ctx.ellipse(0,0,26,23,-.05,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.shadowOffsetY=0;
// Soft cream-colored tummy
ctx.fillStyle='#fff5d8';ctx.beginPath();ctx.ellipse(4,12,16,8,0,0,7);ctx.fill();
// Tiny feather tuft on top
ctx.strokeStyle='#e9ac20';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-8,-19);ctx.quadraticCurveTo(-13,-32,-4,-31);ctx.moveTo(-2,-21);ctx.quadraticCurveTo(0,-35,8,-29);ctx.stroke();
// Animated rounded wing with feather tips
ctx.save();ctx.translate(-12,6);ctx.rotate(-.15+flap*.42);let wing=ctx.createLinearGradient(-18,-12,15,15);wing.addColorStop(0,'#fff9e7');wing.addColorStop(.55,'#ffe89b');wing.addColorStop(1,'#efb634');ctx.fillStyle=wing;ctx.strokeStyle='#d09b37';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(9,-9);ctx.bezierCurveTo(-3,-19,-22,-14,-23,0);ctx.bezierCurveTo(-25,12,-10,20,3,12);ctx.quadraticCurveTo(12,6,9,-9);ctx.fill();ctx.stroke();ctx.strokeStyle='#e9ba61';ctx.lineWidth=1.4;for(let j=0;j<3;j++){ctx.beginPath();ctx.moveTo(-17+j*5,7);ctx.quadraticCurveTo(-10+j*4,12,-5+j*4,10);ctx.stroke()}ctx.restore();
// Two oversized sparkling eyes
for(const [ex,ey,rx] of [[5,-10,8],[18,-9,8]]){ctx.fillStyle='#fffdfb';ctx.strokeStyle='#a66f27';ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(ex,ey,rx,10,0,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#423047';ctx.beginPath();ctx.ellipse(ex+2,ey+1,4.4,6,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex+3,ey-2,2.1,0,7);ctx.fill();ctx.beginPath();ctx.arc(ex+.5,ey+4,1,0,7);ctx.fill()}
// Rosy cheeks
for(const x of [-1,23]){ctx.fillStyle='#ff9290a9';ctx.beginPath();ctx.ellipse(x,8,5.2,3.4,0,0,7);ctx.fill()}
// Short rounded orange beak
ctx.fillStyle='#ff982f';ctx.strokeStyle='#c56a19';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(19,2);ctx.quadraticCurveTo(37,3,34,9);ctx.quadraticCurveTo(26,14,18,9);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function heart(x,y,active){ctx.save();ctx.translate(x,y);ctx.shadowColor=active?'#ff335b88':'transparent';ctx.shadowBlur=active?9:0;ctx.beginPath();ctx.moveTo(0,9);ctx.bezierCurveTo(-22,-4,-18,-19,-7,-19);ctx.bezierCurveTo(-1,-19,0,-15,0,-12);ctx.bezierCurveTo(5,-23,21,-20,19,-6);ctx.bezierCurveTo(18,2,7,10,0,16);ctx.closePath();let g=ctx.createLinearGradient(-10,-18,12,15);g.addColorStop(0,active?'#ff9ca9':'#6d788f');g.addColorStop(1,active?'#ed2759':'#39445e');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=active?'#ffe0e7':'#8590a8';ctx.lineWidth=2;ctx.stroke();if(active){ctx.fillStyle='#ffffffaa';ctx.beginPath();ctx.ellipse(-7,-10,4,2.5,-.6,0,7);ctx.fill()}ctx.restore()}
function draw(){let bg=score>=120?['#292a43','#666c8a']:score>=90?['#71b2fa','#e0ecff']:score>=60?['#12172e','#5a448d']:['#55b9f7','#b5ecff'];let sky=ctx.createLinearGradient(0,0,0,G);sky.addColorStop(0,bg[0]);sky.addColorStop(1,bg[1]);ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
// Sun and drifting cloud layers
ctx.save();ctx.globalAlpha=.75;ctx.fillStyle=score>=60&&score<90?'#d9b8ff':'#fff6b1';ctx.shadowColor='#fff7c0';ctx.shadowBlur=35;ctx.beginPath();ctx.arc(660,105,48,0,7);ctx.fill();ctx.restore();for(const c of clouds)cloud(c);
// Distant landscape
ctx.fillStyle=score>=60&&score<90?'#45477780':'#74c9d980';ctx.beginPath();ctx.moveTo(0,G);for(let x=0;x<=W+20;x+=20)ctx.lineTo(x,G-80-Math.sin(x*.012+frame*.002)*24-Math.sin(x*.03)*15);ctx.lineTo(W,G);ctx.fill();ctx.fillStyle='#43a9a477';ctx.beginPath();ctx.moveTo(0,G);for(let x=0;x<=W+20;x+=20)ctx.lineTo(x,G-34-Math.sin(x*.019+frame*.003)*17);ctx.lineTo(W,G);ctx.fill();
for(const p of pipes)pipe(p);for(const c of cats){ctx.fillStyle='#555b67';ctx.beginPath();ctx.ellipse(c.x+22,c.y+19,23,17,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(c.x+5,c.y+10);ctx.lineTo(c.x+8,c.y-5);ctx.lineTo(c.x+18,c.y+8);ctx.moveTo(c.x+26,c.y+8);ctx.lineTo(c.x+37,c.y-5);ctx.lineTo(c.x+39,c.y+12);ctx.fill();ctx.fillStyle='#9eff65';ctx.fillRect(c.x+10,c.y+15,5,5);ctx.fillRect(c.x+29,c.y+15,5,5)}
drawBird();let earth=ctx.createLinearGradient(0,G,0,H);earth.addColorStop(0,'#d5b46c');earth.addColorStop(1,'#b98555');ctx.fillStyle=earth;ctx.fillRect(0,G,W,H-G);ctx.fillStyle='#44bd66';ctx.fillRect(0,G,W,15);ctx.fillStyle='#83e68e';ctx.fillRect(0,G,W,5);ctx.fillStyle='#a6764e66';for(let x=0;x<W;x+=55){ctx.beginPath();ctx.ellipse(x+((frame*1.3)%55),G+35,9,3,0,0,7);ctx.fill()}
// HUD: three always-visible hearts; depleted hearts turn grey
ctx.fillStyle='#142b50a8';ctx.beginPath();ctx.roundRect(15,13,147,49,18);ctx.fill();for(let i=0;i<3;i++)heart(43+i*45,40,i<lives);
ctx.textAlign='center';ctx.font='900 44px system-ui';ctx.lineWidth=5;ctx.strokeStyle='#173957b0';ctx.strokeText(String(score),W/2,62);ctx.fillStyle='#fff';ctx.fillText(String(score),W/2,62);
if(recordFlash>0){ctx.fillStyle='#fff09a';ctx.font='bold 26px system-ui';ctx.fillText('🏆 NEW RECORD!',W/2,120)}}
function loop(now){if(!last)last=now;acc+=Math.min(100,now-last);last=now;let steps=0;while(acc>=1000/60&&steps<6){step();acc-=1000/60;steps++}draw();requestAnimationFrame(loop)}
$('#start').onclick=flap;$('#restart').onclick=()=>{reset();flap()};$('#pause').onclick=()=>{if(state==='playing')state='paused';else if(state==='paused')state='playing';updateUI()};canvas.addEventListener('pointerdown',e=>{e.preventDefault();flap()});document.addEventListener('keydown',e=>{if(['Space','ArrowUp'].includes(e.code)){if(e.repeat)return;e.preventDefault();flap()}else if(e.code==='KeyP'&&state!=='ready'&&state!=='over'){$('#pause').click()}});$('#lang').onchange=e=>{lang=e.target.value;try{localStorage.setItem('python-games-language',lang)}catch{}updateUI()};document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing'){state='paused';updateUI()}});reset();requestAnimationFrame(loop);
</script></body></html>
